[package]
name = "fnn-migrate"
version = "0.9.0-rc1"
edition = "2021"
build = "build.rs"

[dependencies]

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.18"
console = "0.16.0"
bincode = "1.3.3"
thiserror = "1.0.58"
serde = { version = "1.0.197", features = ["derive"] }
hex = "0.4.3"
clap = { version = "4.0", features = ["derive"] }
ckb-types = "1"
fiber_v060 = { package = "fnn", git = "https://github.com/nervosnetwork/fiber.git", rev = "1cce085111eaa28f8062d5ea394c316bb67de7e6" }
fiber_v061 = { package = "fnn", git = "https://github.com/nervosnetwork/fiber.git", rev = "1318597f168574c4ed5d68dd1c830c026e392b29", features = ["sample"] }
fiber_v070 = { package = "fnn", git = "https://github.com/nervosnetwork/fiber.git", rev = "433de2da8bada5be84d4cd5785e693fe8326df68", features = ["sample"] }
fiber-store = { path = "../crates/fiber-store", features = ["rocksdb"] }
serde_json = "1.0.135"
ouroboros = "0.18.5"

[features]
default = []

[workspace]
